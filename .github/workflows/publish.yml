name: Publish

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --global npm@11.6.2

      - run: npm ci

      - name: Require completed version preparation
        run: |
          node --input-type=module <<'NODE'
          import getReleasePlan from '@changesets/get-release-plan';

          const { changesets, releases } = await getReleasePlan(process.cwd());
          if (changesets.length > 0 || releases.length > 0) {
            console.error('Merge the Version Packages PR before publishing.');
            process.exit(1);
          }
          NODE

      - run: npm run build

      - name: Publish to npm
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
